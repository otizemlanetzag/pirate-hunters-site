<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pirate Hunters</title>
    <style>
        body {
            min-height: 100vh;
            margin: 0;
            position: relative;
            font-family: system-ui, -apple-system, sans-serif;
        }

        .logo {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: block;
            width: min(220px, 70vw);
            max-height: 140px;
            object-fit: contain;
        }

        .my-button {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: inline-block;
            padding: 10px 20px;
            background-color: #000000;
            color: #ffffff;
            text-decoration: none;
            border-radius: 5px;
            font-weight: bold;
            transition: opacity 0.2s ease;
        }

        .my-button:hover {
            background-color: #000000;
            color: #ffffff;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <img src="logo.png" alt="Pirate Hunters logo" class="logo">
    <a href="contact_form/index.html" class="my-button">add your content</a>
</body>
</html>
